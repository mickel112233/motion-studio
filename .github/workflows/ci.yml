name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Electron entrypoints
        run: node --check electron/main.cjs && node --check electron/preload.cjs && node --check electron/mcp-server.cjs && node --check electron/ffmpeg-runtime.cjs && node --check electron/ffmpeg-export.cjs
      - name: Test MCP server
        run: npm run test:mcp
      - name: Test unit suite
        run: npm run test:unit
      - name: Type-check
        run: npm run typecheck
      - name: Build renderer
        run: npm run build

  windows-package:
    runs-on: windows-latest
    needs: validate
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows NSIS installer
        run: npm run dist:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-windows-installer
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
