name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Electron entrypoints
        run: node --check electron/main.cjs && node --check electron/preload.cjs && node --check electron/mcp-server.cjs
      - name: Test MCP server
        run: npm run test:mcp
      - name: Test unit suite
        run: npm run test:unit
      - name: Type-check
        run: npm run typecheck
      - name: Build renderer
        run: npm run build
